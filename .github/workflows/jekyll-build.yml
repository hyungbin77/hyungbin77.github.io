name: Jekyll build

# 사이트 배포 자체는 GitHub Pages가 처리합니다.
# 이 워크플로는 푸시한 내용이 실제로 빌드되는지 미리 확인하는 검사용입니다.
# front matter 오타나 잘못된 Liquid 문법을 배포 전에 잡아줍니다.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jekyll-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
